<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>SGH Lottery Sys · 三仓河抽奖系统</title>
    <meta name="description" content="高科技炫酷风格的轮盘抽奖（离线可用，支持设置抽奖选项）" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="bg__grid"></div>
      <div class="bg__glow"></div>
      <canvas id="particles" class="bg__particles"></canvas>
    </div>

    <header class="hudTop" aria-label="顶部状态栏">
      <div class="hudTop__left">
        <div class="brand" aria-label="应用名称">
          <span class="brand__dot" aria-hidden="true"></span>
          <span class="brand__name">SGH 三仓河抽奖系统</span>
          <span class="brand__tag">LOTTERY SYS</span>
        </div>
      </div>
      <div class="hudTop__right">
        <div class="hudTop__actions">
          <button id="btnFullscreen" class="iconbtn" type="button" title="全屏">
            <span class="icon" aria-hidden="true">⛶</span>
            <span class="sr-only">全屏</span>
          </button>
          <button id="btnSettings" class="iconbtn" type="button" title="设置">
            <span class="icon" aria-hidden="true">⚙</span>
            <span class="sr-only">设置</span>
          </button>
        </div>
      </div>
    </header>

    <main class="hud" aria-label="机甲控制台">
      <section class="hud__center" aria-label="抽奖主控">
        <div class="cockpit">
          <div class="stage">
            <div class="ringHud" aria-hidden="true">
              <div class="ringHud__halo"></div>
              <div class="ringHud__notch"></div>
            </div>

            <div id="track" class="track" aria-label="抽奖矩形跑马灯">
              <div id="slots" class="track__grid" role="list" aria-label="奖项槽位"></div>
              <div class="track__scan" aria-hidden="true"></div>
              <div class="center">
                <div class="center__orb" aria-hidden="true"></div>
                <div class="center__content" aria-label="中心控制台">
                  <div class="winner" aria-live="polite">
                    <div class="winner__title">幸运儿 · 天选之子</div>
                    <div id="resultText" class="winner__value">等待抽取…</div>
                  </div>
                  <button id="btnSpin" class="spin" type="button">
                    <span class="spin__label">启动</span>
                    <span class="spin__hint">Space / Enter</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <aside class="hud__right" aria-label="控制与记录">
        <div class="panel">
          <div class="panel__hd">
            <div class="panel__title">控制</div>
          </div>
          <div class="panel__bd">
            <label class="toggle">
              <input id="toggleSound" type="checkbox" />
              <span class="toggle__ui" aria-hidden="true"></span>
              <span class="toggle__text">音效</span>
            </label>
            <label class="toggle">
              <input id="toggleConfetti" type="checkbox" checked />
              <span class="toggle__ui" aria-hidden="true"></span>
              <span class="toggle__text">彩带</span>
            </label>
            <label class="toggle">
              <input id="toggleRemoveWinner" type="checkbox" />
              <span class="toggle__ui" aria-hidden="true"></span>
              <span class="toggle__text">中奖后移除</span>
            </label>

            <div class="divider"></div>

            <button id="btnResetStats" class="btn btn--danger" type="button">清空统计</button>
          </div>
        </div>

        <div class="panel">
          <div class="panel__hd">
            <div class="panel__title">记录</div>
            <div class="panel__sub"><span id="historyCount">0</span> 条</div>
          </div>
          <div class="panel__bd">
            <ol id="history" class="history" aria-label="中奖记录"></ol>
          </div>
        </div>
      </aside>
    </main>

    <footer class="hudBottom" aria-label="底部任务条">
      <div class="hudBottom__inner">
        <span class="hudBottom__left">SGH LOTTERY SYS</span>
        <span class="hudBottom__right">OFFLINE READY · CONFIG IN LOCAL STORAGE</span>
      </div>
    </footer>

    <dialog id="settingsDialog" class="dialog">
      <form method="dialog" class="dialog__sheet">
        <div class="dialog__hd">
          <div class="dialog__title">抽奖设置</div>
          <button class="iconbtn" value="cancel" type="submit" title="关闭">
            <span class="icon" aria-hidden="true">✕</span>
            <span class="sr-only">关闭</span>
          </button>
        </div>

        <div class="dialog__bd">
          <div class="help">
            <div class="help__line">- 支持录入“选项 + 权重（可选）”。</div>
            <div class="help__line">- 权重越大越容易被抽中（留空默认 1）。</div>
          </div>

          <div class="editor">
            <div class="editor__toolbar">
              <button id="btnAddItem" class="btn" type="button">添加选项</button>
              <button id="btnImport" class="btn btn--ghost" type="button">导入</button>
              <button id="btnExport" class="btn btn--ghost" type="button">导出</button>
            </div>

            <div class="table">
              <div class="table__hd">
                <div>名称</div>
                <div>权重</div>
                <div></div>
              </div>
              <div id="items" class="table__bd" aria-label="抽奖选项列表"></div>
            </div>
            <div class="editor__footer">
              <div id="itemsHint" class="hint">至少 2 个选项才能抽奖。</div>
              <div class="dialog__actions">
                <button id="btnSaveSettings" class="btn" value="ok" type="submit">保存并关闭</button>
              </div>
            </div>
          </div>
        </div>
      </form>
    </dialog>

    <dialog id="importDialog" class="dialog">
      <form method="dialog" class="dialog__sheet">
        <div class="dialog__hd">
          <div class="dialog__title">导入配置</div>
          <button class="iconbtn" value="cancel" type="submit" title="关闭">
            <span class="icon" aria-hidden="true">✕</span>
            <span class="sr-only">关闭</span>
          </button>
        </div>
        <div class="dialog__bd">
          <textarea
            id="importText"
            class="textarea"
            rows="10"
            spellcheck="false"
            placeholder='粘贴 JSON，例如：{"items":[{"label":"A","weight":1}]}'
          ></textarea>
          <div class="dialog__actions">
            <button id="btnDoImport" class="btn" value="ok" type="submit">导入</button>
          </div>
          <div class="hint">导入会覆盖当前设置（不会影响历史记录）。</div>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>

    <script type="module" src="./app.js"></script>
  </body>
</html>
